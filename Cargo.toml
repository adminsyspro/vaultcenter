[workspace]
members = [
    "crates/cold-vtl-api",
    "crates/cold-vtl-cli",
    "crates/cold-vtl-core",
    "crates/cold-vtl-provider-s3",
    "crates/cold-vtl-worker",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.4"

[workspace.dependencies]
axum = "0.7.9"
aws-config = "1.12.0"
aws-sdk-s3 = "1.146.1"
clap = { version = "4.5.48", features = ["derive", "env"] }
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
walkdir = "2.5.0"
