[Service]
# MAINPID is supplied by systemd for this exact daemon, inside its PID namespace.
RuntimeDirectory=vaultcenter-mhvtl-%i
RuntimeDirectoryMode=0700
ExecStartPost=/bin/sh -c 'umask 077; printf "%%s\\n" "$MAINPID" > /run/vaultcenter-mhvtl-%i/pid'
ExecStopPost=-/bin/rm -f /run/vaultcenter-mhvtl-%i/pid
