PACKAGE_NAME="mhvtl"
PACKAGE_VERSION="@VERSION@"
# The source tree is the patched mhvtl archive shipped in the image; its kernel
# module sources live in kernel/.
MAKE[0]="make -C kernel KDIR=/lib/modules/${kernelver}/build"
CLEAN="make -C kernel clean"
BUILT_MODULE_NAME[0]="mhvtl"
BUILT_MODULE_LOCATION[0]="kernel"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
