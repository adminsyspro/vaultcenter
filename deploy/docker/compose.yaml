name: vaultcenter
services:
  appliance:
    image: ${VAULTCENTER_IMAGE:?Set VAULTCENTER_IMAGE to a tested GHCR image digest}
    # Full appliance: dedicated Linux VM, preloaded mhvtl and sg modules.
    privileged: true
    network_mode: host
    cgroup: host
    restart: unless-stopped
    stop_grace_period: 300s
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /dev:/dev
      - state:/var/lib/cold-vtl
      - media:/opt/mhvtl
      - mhvtl-config:/etc/mhvtl
      - type: bind
        source: ./config/cold-vtl
        target: /etc/cold-vtl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/targets.conf
        target: /etc/tgt/targets.conf
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  state:
  media:
  mhvtl-config:
