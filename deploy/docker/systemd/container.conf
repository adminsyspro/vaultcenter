[Service]
Environment=COLD_VTL_UI_DIR=/usr/local/share/vaultcenter/ui
Environment=COLD_VTL_MAINTENANCE_HELPER=/usr/local/libexec/cold-vtl-maintenance
Environment=COLD_VTL_CARTRIDGE_HELPER=/usr/local/libexec/cold-vtl-cartridges
Environment=COLD_VTL_REINTEGRATION_HELPER=/usr/local/libexec/cold-vtl-reintegration
Environment=COLD_VTL_ARCHIVE_HELPER=/usr/local/libexec/cold-vtl-archive
ReadOnlyPaths=
ReadOnlyPaths=/etc/cold-vtl
ReadWritePaths=/opt/mhvtl /etc/mhvtl
StandardOutput=journal+console
StandardError=journal+console
